spring.application.name=vehiculosnotificacion
spring.datasource.url=jdbc:postgresql://localhost:5432/backend_db
spring.datasource.username=backend_usr
spring.datasource.password=backend_pwd
spring.datasource.driver-class-name=org.postgresql.Driver

# define ruta swagger
springdoc.swagger-ui.path=/swagger-ui.html

# ordena endpoints por metodo
springdoc.swagger-ui.operationsSorter=method

# ordena grupos alfabeticamente
springdoc.swagger-ui.tagsSorter=alpha